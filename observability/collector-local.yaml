# ADOT Collector configuration for local development.
#
# Same collector binary as the one that runs beside the task on Fargate; only
# the exporters differ. Locally the traces are printed and forwarded to Jaeger
# so the waterfall can be seen in a browser without an AWS account.

receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317

processors:
    batch:
        timeout: 1s
        send_batch_size: 50

exporters:
    # Prints spans to the collector's own stdout — proof the app is exporting
    # even before any backend is wired up.
    debug:
        verbosity: detailed

    otlp/jaeger:
        endpoint: jaeger:4317
        tls:
            insecure: true

service:
    pipelines:
        traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug, otlp/jaeger]
    telemetry:
        logs:
            level: info
